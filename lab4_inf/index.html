<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вариант 6 — Смена картинки</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding: 40px;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      width: min(500px, 100%);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    img {
      display: block;
      width: 100%;
      max-width: 420px;
      height: auto;
      margin: 20px auto;
      border-radius: 6px;
    }
    button {
      padding: 10px 18px;
      background: #3498db;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #2980b9; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Смена изображения</h1>
    <img id="myImage" src="images/image1.jpg" alt="Первое изображение">
    <button id="changeButton">Сменить картинку</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
